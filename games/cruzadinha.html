<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Palavras Cruzadas | Toponímia Urbana de Ouro Branco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap e Icones (apenas para a Navbar e fontes base) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>

  <!-- O CSS original da cruzadinha -->
  <link rel="stylesheet" href="../src/styles/style_game.css">
  
  <style>
    /* Navbar override from main style to ensure it doesn't break style_game */
    .bg-dark { background-color: var(--dark) !important; }
    .btn-outline-light { border-color: white; color: white; }
    .btn-outline-light:hover { background-color: white; color: var(--dark); }
    .navbar .container-fluid { flex-wrap: nowrap; }
    @media (max-width: 575.98px) {
      .navbar-brand { font-size: 0.8rem !important; white-space: nowrap !important; }
      .btn-outline-light { font-size: 0.75rem !important; padding: 0.25rem 0.5rem !important; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">Toponímia Urbana de Ouro Branco</a>
        <div class="ms-auto">
          <a href="../portaleducativo.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="game-container">
    <h1 class="game-title">Palavras Cruzadas</h1>
    
    <div class="game-header">
      <div class="controls">
        <button class="game-button check" id="check-button"><i class="bi bi-check-circle"></i> Verificar</button>
        <button class="game-button hint" id="hint-button"><i class="bi bi-lightbulb"></i> Dica</button>
        <button class="game-button restart" id="restart-button"><i class="bi bi-arrow-clockwise"></i> Reiniciar</button>
      </div>
      <div id="timer"><i class="bi bi-clock"></i> 00:00</div>
    </div>

    <div class="game-content">
      <div class="crossword-section">
        <div class="crossword-scroll-wrapper">
          <div class="scroll-hint"><i class="bi bi-arrows-expand"></i>Role para ver tudo</div>
          <div id="crossword-container" role="grid" aria-label="Grade de palavras cruzadas">
            <div id="crossword"></div>
          </div>
        </div>
      </div>

      <div class="clues-section">
        <h2>Dicas - Escolas</h2>
        <ul id="clues-list"></ul>
        
        <div class="game-status">
          <div id="status-message" aria-live="polite" role="status">Complete a cruzadinha!</div>
          <div class="progress-container">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../src/legacy/games/cruzadinha.js"></script>
</body>
</html>
